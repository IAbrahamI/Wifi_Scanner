; ============================================================================
;  DIY Dual-Purpose Handheld RF Gadget  --  LILYGO T-Display-S3 Touch
;
;  One project, several standalone firmwares. Each `env` below builds a
;  different app and flashes it into its own slot of the 16 MB flash:
;
;     pio run -e menu    -t upload     -> factory @ 0x010000  (launcher)
;     pio run -e scanner -t upload     -> ota_1   @ 0x610000  (WiFi+BLE)
;     pio run -e csi     -t upload     -> ota_0   @ 0x210000  (not built yet)
;
;  Flash `menu` first -- it is the factory partition and is what the
;  bootloader falls back to.
; ============================================================================

[platformio]
default_envs = menu
boards_dir   = boards

; ---------------------------------------------------------------- shared ---
[common]
platform  = espressif32@^6.9.0
framework = arduino
board     = lilygo-t-display-s3-touch

board_build.partitions = partitions_multiapp.csv

upload_speed   = 921600
monitor_speed  = 115200
; The S3 exposes a native USB CDC port; RTS/DTR toggling resets it mid-session.
monitor_rts    = 0
monitor_dtr    = 0
monitor_filters = esp32_exception_decoder, colorize

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
    lovyan03/LovyanGFX@^1.1.16

; Rewrites the flash offset so each env lands in its own partition.
extra_scripts = post:tools/app_offset.py

; ------------------------------------------------------- App 0: launcher ---
[env:menu]
extends           = common
build_src_filter  = +<board/> +<menu/>
custom_app_offset = 0x10000
; Flashing the launcher also blanks otadata, so the board comes back up here.
custom_reset_otadata = yes

; ------------------------------------------- App 2: WiFi + BLE proximity ---
[env:scanner]
extends           = common
build_src_filter  = +<board/> +<scanner/>
custom_app_offset = 0x610000
; Note: the "Flash: x% of 2097152" figure printed for this env is wrong but
; harmless -- PlatformIO sizes against the first app partition (factory, 2 MB).
; This app actually lands in ota_1, which is 4 MB.
lib_deps =
    ${common.lib_deps}
    h2zero/NimBLE-Arduino@^1.4.2

; ---------------------------------------------- App 1: Wi-Fi CSI radar ---
[env:csi]
extends           = common
build_src_filter  = +<board/> +<csi/>
custom_app_offset = 0x210000
board_upload.maximum_size = 4194304

; ------------------------------------------------- App 3: RF Toolkit ---
; Five lightweight WiFi/BLE security tools behind a sub-menu. New partition
; carved from spiffs; existing apps and stored credentials are untouched.
[env:toolkit]
extends           = common
build_src_filter  = +<board/> +<toolkit/>
custom_app_offset = 0xA10000
board_upload.maximum_size = 4194304
lib_deps =
    ${common.lib_deps}
    h2zero/NimBLE-Arduino@^1.4.2
